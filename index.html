<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Copa Interna Pile 2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,700;0,800;0,900;1,700;1,800&display=swap">
<style>
:root {
  --bg-1: #e62020;
  --bg-2: #8b0000;
  --panel-1: #e62020;
  --panel-2: #b31010;
  --row: #1a1a1a;
  --row-text: #ffffff;
  --slant: #ffffff;
  --slant-text: #000000;
  --head-bg: #ffffff;
  --head-text: #000000;
  --line: #e62020;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
:root:not([data-theme="light"]) { color-scheme: light; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg-1: #b01818;
    --bg-2: #5a0000;
    --panel-1: #b01818;
    --panel-2: #800c0c;
    --row: #121212;
    --slant: #f2f2f2;
    --head-bg: #f2f2f2;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg-1: #b01818;
  --bg-2: #5a0000;
  --panel-1: #b01818;
  --panel-2: #800c0c;
  --row: #121212;
  --slant: #f2f2f2;
  --head-bg: #f2f2f2;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: inherit; }
html { min-height: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
  font-family: "Montserrat", Arial, Helvetica, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 16px 8px;
}
.container {
  width: 100%;
  max-width: 900px;
  background:
    repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 42px, rgba(0,0,0,.10) 42px 84px),
    linear-gradient(160deg, #b80c0c, #6a0000 70%, #4a0000);
  padding: clamp(8px, 2.5vw, 20px);
}
.header {
  position: relative;
  text-align: center;
  color: #fff;
  margin-bottom: clamp(10px, 2.5vw, 20px);
  min-height: clamp(48px, 10vw, 80px);
}
.logo-area {
  position: absolute;
  top: 0;
  left: 0;
  display: flex;
  align-items: center;
  font-size: clamp(8px, 1.6vw, 14px);
  font-weight: bold;
  line-height: 1.2;
  text-align: left;
}
.logo-area svg {
  width: clamp(18px, 3.3vw, 30px);
  height: clamp(18px, 3.3vw, 30px);
  margin-right: 6px;
  fill: #fff;
  flex: none;
}
.header h1 {
  margin: 0;
  font-size: clamp(32px, 9vw, 80px);
  font-weight: 900;
  letter-spacing: 1px;
  text-shadow: 2px 3px 5px rgba(0,0,0,.4);
  padding-top: clamp(14px, 1vw, 0px);
}
.table-header, .row {
  display: grid;
  grid-template-columns: clamp(20px, 8.9vw, 80px) minmax(0, 1fr) repeat(4, clamp(22px, 8.9vw, 80px)) clamp(26px, 10vw, 90px);
}
.table-header {
  background: var(--head-bg);
  color: var(--head-text);
  font-weight: bold;
  font-style: italic;
  font-size: clamp(8px, 2.2vw, 18px);
  padding: 10px 0;
  text-align: center;
}
.table-header div:nth-child(2) { text-align: left; padding-left: clamp(8px, 3.3vw, 30px); }
.row {
  background: var(--row);
  color: var(--row-text);
  height: clamp(44px, 7.2vw, 65px);
  margin-top: 6px;
  font-size: clamp(10px, 2.2vw, 20px);
  font-weight: bold;
}
.row > div {
  min-width: 0;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100%;
  border-right: 3px solid var(--line);
}
.row > div:last-child { border-right: none; }
.rank { font-size: clamp(16px, 3.3vw, 30px); }
.team-col {
  position: relative;
  padding-left: clamp(4px, 2.2vw, 20px);
  justify-content: flex-start !important;
}
.white-slant {
  position: absolute;
  left: 10px;
  right: 10px;
  top: 0;
  height: 100%;
  background: var(--slant);
  transform: skewX(-25deg);
  z-index: 1;
}
.team-name {
  position: relative;
  z-index: 2;
  color: var(--slant-text);
  font-style: italic;
  font-weight: 800;
  line-height: 1.1;
  font-size: clamp(8.5px, 2.6vw, 18px);
  padding-left: clamp(4px, 2.8vw, 25px);
  padding-right: clamp(14px, 5vw, 34px);
  min-width: 0;
  overflow-wrap: anywhere;
  text-transform: uppercase;
}
@media (max-width: 320px) {
  .logo-area { position: static; justify-content: center; margin-bottom: 4px; }
  .header { min-height: 0; }
  .header h1 { padding-top: 0; }
}
.fixture {
  --cond: "Bebas Neue", Impact, "Arial Narrow", sans-serif;
  margin-top: clamp(18px, 4vw, 34px);
  padding: clamp(12px, 3vw, 28px) clamp(8px, 2.5vw, 24px) clamp(14px, 3vw, 26px);
  color: #fff;
}
.fx-top {
  text-align: center;
  font-family: var(--cond);
  letter-spacing: .35em;
  font-size: clamp(11px, 2.4vw, 20px);
  line-height: 1.5;
}
.fx-title {
  text-align: center;
  font-family: var(--cond);
  font-size: clamp(56px, 15vw, 130px);
  line-height: 1;
  margin: 2px 0 clamp(8px, 2vw, 16px);
  text-shadow: 2px 3px 6px rgba(0,0,0,.35);
}
.match { margin-top: clamp(8px, 1.6vw, 14px); }
.match-time {
  width: 70%;
  margin: 0 auto;
  background: #ff2323;
  text-align: center;
  font-family: var(--cond);
  letter-spacing: .12em;
  font-size: clamp(14px, 3vw, 26px);
  padding: 2px 0;
}
.match-row {
  display: grid;
  grid-template-columns: auto 1fr auto 1fr auto;
  background: #fff;
  color: #222;
  min-height: clamp(52px, 10vw, 96px);
}
.logo {
  display: flex;
  align-items: center;
  justify-content: center;
  height: clamp(52px, 10vw, 96px);
  width: clamp(48px, 10.5vw, 100px);
  padding: 3px;
  background: #fff;
}
.logo img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; }
.tname {
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 0 4px;
  font-family: var(--cond);
  font-size: clamp(14px, 3.6vw, 34px);
  line-height: 1;
  text-transform: uppercase;
}
.vs {
  display: flex;
  align-items: center;
  padding: 0 clamp(12px, 4vw, 34px);
  background: #d32a2a;
  color: #fff;
  font-family: var(--cond);
  font-size: clamp(20px, 5vw, 44px);
}
.rest {
  display: flex;
  align-items: center;
  gap: clamp(8px, 2vw, 20px);
  margin-top: clamp(14px, 3vw, 24px);
}
.rest svg { width: clamp(60px, 15vw, 130px); height: auto; flex: none; }
.rest .logo { height: clamp(56px, 13vw, 110px); width: clamp(56px, 13vw, 110px); }
.rest-name {
  font-family: var(--cond);
  font-size: clamp(18px, 4.6vw, 42px);
  line-height: 1.05;
  text-transform: uppercase;
}
.rest-name small { display: block; font-size: .5em; letter-spacing: .25em; opacity: .85; }

.rank.semi { background: #15803d; color: #fff; }
.rank.elim { background: #29a9e0; color: #000; }
.rank.out  { background: #e11d48; color: #fff; }

.leyenda {
  margin-top: 12px;
  color: #fff;
  font-weight: bold;
  font-size: clamp(10px, 2.4vw, 16px);
}
.leyenda div { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
.dot { width: 12px; height: 12px; border-radius: 2px; flex: none; }
.dot.semi { background: #15803d; }
.dot.elim { background: #29a9e0; }
.dot.out  { background: #e11d48; }
</style>
</head>

/* =====================================================================
   3. CÓDIGO QUE DIBUJA LA PÁGINA  (no hace falta tocarlo)
   ===================================================================== */

// Títulos
document.getElementById("titulo-tabla").textContent = "FECHA " + FECHA_TABLA;
document.getElementById("titulo-proxima").textContent = FECHA_PROXIMA + " FECHA";

// Tabla de posiciones
var html = "";
equipos.forEach(function (e, i) {
  html += '<div class="row"><div class="rank ' + (i === 0 ? 'semi' : i < 7 ? 'elim' : 'out') + '">' + (i + 1) + '</div>' +
    '<div class="team-col"><div class="white-slant"></div><span class="team-name">' + e[0] + '</span></div>' +
    '<div>' + e[1] + '</div><div>' + e[2] + '</div><div>' + e[3] + '</div><div>' + e[4] + '</div><div>' + e[5] + '</div></div>';
});
document.getElementById("tabla").innerHTML = html;

// Próximos partidos
function escudo(c) {
  return '<div class="logo"><img src="' + logos[c] + '" alt="' + nombres[c] + '"></div>';
}
var h2 = "";
partidos.forEach(function (p) {
  h2 += '<div class="match"><div class="match-time">' + p[0] + '</div>' +
    '<div class="match-row">' + escudo(p[1]) +
    '<div class="tname">' + nombres[p[1]] + '</div><div class="vs">VS</div>' +
    '<div class="tname">' + nombres[p[2]] + '</div>' + escudo(p[2]) + '</div></div>';
});

// Equipo que descansa (flechas + escudo + nombre)
var chev = '<svg viewBox="0 0 120 40" aria-hidden="true">';
for (var i = 0; i < 4; i++) {
  var x = i * 26;
  chev += '<polygon fill="#ff2323" points="' + x + ',0 ' + (x + 14) + ',0 ' + (x + 30) + ',20 ' + (x + 14) + ',40 ' + x + ',40 ' + (x + 16) + ',20"/>';
}
chev += '</svg>';
h2 += '<div class="rest">' + chev + escudo(descansa) +
  '<div class="rest-name"><small>Descansa</small>' + nombres[descansa] + '</div></div>';
document.getElementById("proxima").innerHTML = h2;
</script>
</body>
</html>
